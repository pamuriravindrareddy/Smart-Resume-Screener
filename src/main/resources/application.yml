server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: smart-resume-screener
  
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/smart_resume_screener?useSSL=${MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# OpenRouter LLM Configuration
openrouter:
  api:
    url: https://openrouter.ai/api/v1/chat/completions
    key: ${OPENROUTER_API_KEY}
    referer: ${OPENROUTER_REFERER:http://localhost:8080}
  model: ${OPENROUTER_MODEL:openrouter/free}
  max-tokens: ${OPENROUTER_MAX_TOKENS:2048}
  client:
    connect-timeout-ms: ${OPENROUTER_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${OPENROUTER_READ_TIMEOUT_MS:30000}
